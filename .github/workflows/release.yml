name: Release

# A tag v* builds the archives and attaches them to a GitHub release.
# workflow_dispatch builds the archives of an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v1.0.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The full CI (fmt, clippy, tests on four systems and on Rust 1.85, audit,
  # licenses, glibc). Nothing is built or published unless it passes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # The license texts of the crates in the binary, generated once.
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: THIRD-PARTY-LICENSES.html

  build:
    name: Build ${{ matrix.target }}
    needs: [ci, licenses]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc baseline at 2.34.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: licenses
      - name: Check the highest glibc symbol
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: bash scripts/check-glibc.sh "target/${{ matrix.target }}/release/lambda-bill" 2.34
      - name: Package
        shell: bash
        run: |
          name="lambda-bill-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md README.nl.md QUALITY.md QUALITY.nl.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../target/${{ matrix.target }}/release/lambda-bill.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "../target/${{ matrix.target }}/release/lambda-bill" "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -rf "$name"
      - name: Smoke test the archive
        shell: bash
        run: |
          name="lambda-bill-${TAG}-${{ matrix.target }}"
          mkdir smoke
          cd smoke
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x "../dist/$name.zip" > /dev/null
            bin="./lambda-bill.exe"
          else
            tar -xzf "../dist/$name.tar.gz"
            bin="./lambda-bill"
          fi
          cd "$name"
          test -f THIRD-PARTY-LICENSES.html
          got=$("$bin" --version | tr -d '\r')
          echo "$got"
          test "$got" = "lambda-bill ${TAG#v}"
          "$bin" --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: [ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*-*'
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          test "$(ls ./*.tar.gz ./*.zip | wc -l)" -eq 5
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*
          else
            gh release create "$TAG" --title "lambda-bill $TAG" --generate-notes --verify-tag ./*
          fi
