[package]
name = "lambda-bill"
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
authors = ["PEPAI <pep_ai@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Offline cost of AWS Lambda on-demand usage from CloudWatch REPORT lines"
readme = "README.md"
exclude = ["/task.md", "/blueprint.md", "/.github/", "/.gitattributes", "/scripts/", "*-plugin/"]
repository = "https://github.com/qwpp7g79y4-maker/lambda-bill"
homepage = "https://www.pepai.nl"
documentation = "https://github.com/qwpp7g79y4-maker/lambda-bill"
keywords = ["aws", "lambda", "cost", "cloudwatch", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "lambda_bill"
path = "src/lib.rs"

[[bin]]
name = "lambda-bill"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
rust_decimal = "1.43.0"
serde = { version = "1", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
